<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guía de San Vicente de Chucurí</title>
<meta name="description" content="Todo San Vicente de Chucurí en un solo link: emergencias, restaurantes, hoteles, turismo y comercio, con perfiles y reseñas de la gente.">
<meta property="og:title" content="Guía de San Vicente de Chucurí">
<meta property="og:description" content="Restaurantes, hoteles, turismo y comercio del pueblo en un mapa, con reseñas de la gente.">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --prim:#0f766e; --prim-osc:#0b4f4a; --prim-claro:#e3f3f0;
  --acento:#f59e0b; --coral:#ef6c57;
  --fondo:#f4f7f6; --texto:#12302b; --gris:#64748b; --borde:#dbe5e2; --suave:#eef4f2;
  --rojo:#dc2626; --estrella:#f59e0b;
  --sombra:0 8px 28px rgba(11,79,74,.16);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Nunito,system-ui,sans-serif;color:var(--texto);background:var(--fondo)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
img{display:block}
.app{display:flex;flex-direction:column;height:100%;height:100dvh;position:relative}

/* Encabezado */
header{background:linear-gradient(135deg,var(--prim) 0%,var(--prim-osc) 100%);color:#fff;padding:calc(12px + var(--safe-t)) 14px 12px;z-index:20}
.titulo{display:flex;align-items:center;gap:10px}
.titulo.con-logo{flex-direction:column;gap:6px;text-align:center;margin:-4px -6px 0}
.titulo.con-logo .logo-pueblo{width:100%;height:auto;max-width:100%;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.titulo.con-logo h1{font-size:15px;font-weight:800;opacity:.95}
.titulo.con-logo small{display:none}
.titulo .logo{width:38px;height:38px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:20px}
.titulo h1{font-size:18px;margin:0;font-weight:900;line-height:1.1}
.titulo small{display:block;font-weight:600;opacity:.85;font-size:12.5px}
.buscar{margin-top:10px;position:relative}
.buscar input{width:100%;border:0;border-radius:14px;padding:12px 14px 12px 40px;font-size:16px;outline:none;background:#fff}
.buscar span{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5}

/* Emergencias */
.sos{display:flex;gap:8px;overflow-x:auto;padding:9px 12px;background:#fff5f4;border-bottom:1px solid #fbd5d0;scrollbar-width:none;z-index:15}
.sos::-webkit-scrollbar{display:none}
.sos b{color:var(--rojo);font-size:13px;white-space:nowrap;align-self:center}
.sos a{flex:none;text-decoration:none;background:var(--rojo);color:#fff;border-radius:999px;padding:9px 14px;font-weight:800;font-size:14px;white-space:nowrap}
.sos a.sec{background:#fff;color:var(--rojo);border:1.5px solid var(--rojo)}

.sos-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--rojo);color:#fff;border-radius:14px;padding:11px 14px;font-weight:900;font-size:15px;min-height:46px}
.sos-btn small{font-weight:700;opacity:.9;font-size:12.5px}
.emerg{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--borde);border-radius:18px;padding:14px;margin-bottom:10px}
.emerg .ico{width:52px;height:52px;font-size:26px;background:#fee2e2}
.emerg h3{margin:0;font-size:16px;line-height:1.2}
.emerg p{margin:3px 0 0;font-size:13.5px;color:var(--gris)}
.emerg .cuerpo{flex:1;min-width:0}
.llamar{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;background:var(--rojo);color:#fff;border-radius:14px;padding:9px 12px;font-weight:900;font-size:12.5px;min-width:72px}
.llamar span{font-size:20px}
.emerg .mini{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.emerg .mini button{border:0;background:var(--suave);border-radius:10px;padding:7px 10px;font-weight:800;font-size:12.5px}
.titulo-sec{font-size:13px;font-weight:900;color:var(--gris);text-transform:uppercase;letter-spacing:.5px;margin:18px 2px 8px}

/* Categorías */
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--borde);scrollbar-width:none;z-index:14}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--borde);background:#fff;border-radius:999px;padding:9px 14px;min-height:40px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip.on{background:var(--prim);border-color:var(--prim);color:#fff}

/* Cuerpo */
main{flex:1;position:relative;display:flex;min-height:0}
#mapa{flex:1;z-index:1;background:#e5ece9}
.lista{position:absolute;inset:0;overflow-y:auto;background:var(--fondo);z-index:5;display:none;padding-bottom:14px}
.lista.ver{display:block}
.lista-cab{padding:14px 16px 2px;color:var(--gris);font-size:14px;font-weight:700}
.orden{display:flex;gap:8px;padding:8px 12px 2px}
.orden button{border:1.5px solid var(--borde);background:#fff;border-radius:999px;padding:7px 12px;font-weight:800;font-size:13px;min-height:36px}
.orden button.on{background:var(--texto);border-color:var(--texto);color:#fff}
.tarjeta{display:flex;gap:12px;align-items:center;background:#fff;margin:10px 12px;padding:12px;border-radius:18px;border:1px solid var(--borde);cursor:pointer;min-height:76px;-webkit-tap-highlight-color:transparent}
.tarjeta:active{transform:scale(.98)}
.tarjeta .cuerpo{flex:1;min-width:0}
.ico{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:26px;overflow:hidden}
.ico img{width:100%;height:100%;object-fit:cover}
.tarjeta h3{margin:0 0 2px;font-size:16.5px;line-height:1.2}
.tarjeta p{margin:0;color:var(--gris);font-size:13.5px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.dist{flex:none;font-size:12.5px;font-weight:800;color:var(--prim);background:var(--prim-claro);border-radius:8px;padding:4px 7px}
.tag{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:7px;margin-top:5px;background:var(--suave);color:var(--prim-osc)}
.tag.oficial{background:#e0f2fe;color:#0369a1}
.tag.sinpin{background:#fef3c7;color:#92400e}
.tag.pend{background:#fef3c7;color:#92400e}.tag.ok{background:#dcfce7;color:#166534}.tag.no{background:#fee2e2;color:#991b1b}
.cal{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;font-weight:900;margin-top:3px}
.cal small{color:var(--gris);font-weight:700}
.estrellas{color:var(--estrella);letter-spacing:1px;white-space:nowrap}
.vacio{padding:30px 20px;text-align:center;color:var(--gris)}
.pie{font-size:13px;color:var(--gris);text-align:center;padding:18px}

/* Barra inferior */
nav.tabs{display:flex;background:#fff;border-top:1px solid var(--borde);padding-bottom:var(--safe-b);z-index:20;box-shadow:0 -4px 16px rgba(11,79,74,.06)}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 9px;font-weight:800;font-size:12px;color:var(--gris);display:flex;flex-direction:column;align-items:center;gap:1px;min-height:58px}
nav.tabs button span{font-size:22px;line-height:1.1}
nav.tabs button.on{color:var(--prim)}
nav.tabs button.mas span{background:var(--coral);color:#fff;width:40px;height:30px;border-radius:12px;display:grid;place-items:center;font-size:18px}

/* Mapa */
.flotantes{position:absolute;right:12px;bottom:16px;z-index:4;display:flex;flex-direction:column;gap:10px}
.flot{width:50px;height:50px;border-radius:50%;border:0;background:#fff;box-shadow:var(--sombra);font-size:22px;display:grid;place-items:center}
.flot:active{transform:scale(.93)}
.pin{width:24px;height:24px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 7px rgba(0,0,0,.35)}
.pin-of{width:42px;height:42px;border-radius:50%;border:3px solid #fff;display:grid;place-items:center;font-size:22px;box-shadow:0 3px 10px rgba(0,0,0,.35);overflow:hidden;background:#fff}
.pin-of img{width:100%;height:100%;object-fit:cover}
.yo{width:18px;height:18px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 0 0 7px rgba(37,99,235,.25)}
.leaflet-control-zoom{display:none}
.marker-cluster-small,.marker-cluster-medium,.marker-cluster-large{background:rgba(15,118,110,.25)!important}
.marker-cluster-small div,.marker-cluster-medium div,.marker-cluster-large div{background:var(--prim)!important;color:#fff;font-weight:900;font-family:Nunito,sans-serif}
.vista-pin{position:absolute;left:12px;right:74px;bottom:16px;z-index:4;background:#fff;border-radius:18px;box-shadow:var(--sombra);display:none;gap:10px;align-items:center;padding:10px;cursor:pointer}
.vista-pin.ver{display:flex}
.vista-pin .ico{width:52px;height:52px}
.vista-pin h3{margin:0;font-size:15.5px}
.vista-pin p{margin:2px 0 0;font-size:13px;color:var(--gris)}
.vista-pin .ir{margin-left:auto;font-size:13px;font-weight:900;color:var(--prim);white-space:nowrap}

/* Pantallas completas (perfil, editor, mi negocio, admin) */
.pantalla{position:fixed;inset:0;background:var(--fondo);z-index:900;overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.pantalla.ver{display:block;animation:entra .22s ease}
@keyframes entra{from{transform:translateX(30px);opacity:.3}to{transform:none;opacity:1}}
.barra-sup{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--safe-t)) 12px 10px;background:#fff;border-bottom:1px solid var(--borde)}
.barra-sup h2{margin:0;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atras{width:40px;height:40px;border-radius:50%;border:0;background:var(--suave);font-size:20px;flex:none}
.contenido{padding:14px 14px calc(30px + var(--safe-b))}

/* Perfil */
.portada{position:relative;height:220px;background:linear-gradient(135deg,var(--prim),var(--prim-osc));overflow:hidden}
.portada img{width:100%;height:100%;object-fit:cover}
.portada .emoji{position:absolute;inset:0;display:grid;place-items:center;font-size:80px;opacity:.35}
.portada .btns{position:absolute;top:calc(10px + var(--safe-t));left:12px;right:12px;display:flex;justify-content:space-between}
.portada .btns button{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:19px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.cab-perfil{position:relative;background:#fff;border-radius:24px 24px 0 0;margin-top:-24px;padding:0 16px 14px}
.avatar{width:86px;height:86px;border-radius:24px;border:4px solid #fff;background:var(--suave);margin-top:-44px;overflow:hidden;display:grid;place-items:center;font-size:38px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.avatar img{width:100%;height:100%;object-fit:cover}
.cab-perfil h1{margin:10px 0 2px;font-size:23px;line-height:1.15}
.cab-perfil .linea{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;color:var(--gris);font-weight:700}
.cab-perfil .linea .cal{font-size:15px;margin:0;color:var(--texto)}
.acciones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.acc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;border:0;background:var(--suave);border-radius:16px;padding:10px 4px;min-height:64px;font-weight:800;font-size:12.5px;color:var(--texto);text-align:center}
.acc span{font-size:22px}
.acc.prim{background:var(--prim);color:#fff}
.acc.wa{background:#25d366;color:#fff}
.redes{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.redes a{display:flex;align-items:center;gap:6px;text-decoration:none;border:1.5px solid var(--borde);border-radius:999px;padding:7px 12px;font-weight:800;font-size:13.5px;background:#fff}
.pestanas-perfil{position:sticky;top:0;z-index:4;display:flex;background:#fff;border-bottom:1px solid var(--borde);padding-top:var(--safe-t)}
.pestanas-perfil button{flex:1;border:0;background:none;padding:13px 4px;font-weight:900;font-size:14px;color:var(--gris);border-bottom:3px solid transparent}
.pestanas-perfil button.on{color:var(--prim);border-color:var(--prim)}
.seccion{background:#fff;margin-top:10px;padding:16px}
.seccion h3{margin:0 0 10px;font-size:17px}
.desc{line-height:1.55;color:#334155;margin:0;white-space:pre-line}
.dato{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--suave);font-size:15px;align-items:flex-start}
.dato:first-of-type{border-top:0}
.dato span:first-child{width:24px;text-align:center;flex:none}
.menu-item{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--suave)}
.menu-item:first-child{border-top:0}
.menu-item b{font-size:15.5px}
.menu-item p{margin:2px 0 0;font-size:13.5px;color:var(--gris)}
.menu-item .precio{font-weight:900;color:var(--prim);white-space:nowrap}
.galeria{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.galeria img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:pointer}
.visor{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1500;display:none;align-items:center;justify-content:center}
.visor.ver{display:flex}
.visor img{max-width:100%;max-height:90vh;object-fit:contain}
.visor button{position:absolute;top:calc(14px + var(--safe-t));right:14px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px}
.btn-editar-perfil{display:block;width:100%;margin-top:12px;border:2px dashed var(--prim);background:var(--prim-claro);color:var(--prim-osc);border-radius:14px;padding:12px;font-weight:900}

/* Reseñas */
.resumen{display:flex;gap:14px;align-items:center;background:var(--suave);border-radius:18px;padding:14px}
.resumen .grande{font-size:42px;font-weight:900;line-height:1;text-align:center}
.resumen .grande small{display:block;font-size:12.5px;color:var(--gris);font-weight:700;margin-top:5px}
.barras{flex:1;display:flex;flex-direction:column;gap:6px}
.barra{display:grid;grid-template-columns:24px 1fr 30px;align-items:center;gap:6px;font-size:13px;font-weight:800}
.barra .fondo{height:8px;background:#dbe5e2;border-radius:9px;overflow:hidden}
.barra .lleno{height:100%;background:var(--estrella);border-radius:9px}
.leyenda{font-size:12.5px;color:var(--gris);margin-top:8px;line-height:1.5}
.resena{padding:13px 0;border-top:1px solid var(--suave)}
.resena .quien{display:flex;justify-content:space-between;gap:8px;font-weight:900;font-size:15px}
.resena .quien small{color:var(--gris);font-weight:600}
.resena p{margin:6px 0 0;font-size:14.5px;line-height:1.45;color:#334155}
.mini-asp{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.mini-asp span{font-size:12px;font-weight:800;background:var(--suave);border-radius:8px;padding:3px 7px}
.b-del{border:0;background:#fee2e2;color:var(--rojo);border-radius:8px;padding:6px 10px;font-weight:800;font-size:12px;margin-top:7px}
.calificar-fila{background:var(--suave);border-radius:16px;padding:10px 12px;margin-top:10px}
.calificar-fila .nom{font-weight:900;font-size:15px;display:flex;justify-content:space-between}
.calificar-fila .nom small{color:var(--gris);font-weight:700}
.pick{display:flex;justify-content:space-between;margin-top:4px}
.pick button{border:0;background:none;font-size:34px;line-height:1;padding:4px;color:#cbd5d1;min-width:44px;min-height:44px}
.pick button.on{color:var(--estrella)}

/* Formularios */
.form label{display:block;font-weight:800;font-size:14.5px;margin:14px 0 6px}
.form input,.form select,.form textarea{width:100%;border:1.5px solid var(--borde);border-radius:13px;padding:13px 14px;font-size:16px;background:#fff;outline:none}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--prim)}
.form textarea{min-height:90px;resize:vertical}
.bloque{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;border:1px solid var(--borde)}
.bloque>h3{margin:0 0 2px;font-size:17px}
.bloque>.ayuda:first-of-type{margin-top:0}
.ayuda{font-size:13px;color:var(--gris);margin-top:5px;line-height:1.4}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.fila2{grid-template-columns:1fr}}
.mini-mapa{height:260px;border-radius:14px;border:1.5px solid var(--borde);margin-top:8px}
.subir-portada{position:relative;height:150px;border-radius:16px;overflow:hidden;background:var(--suave);border:2px dashed #b8cbc6;display:grid;place-items:center;color:var(--gris);font-weight:800;cursor:pointer;margin-top:8px}
.subir-portada img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.subir-logo{width:96px;height:96px;border-radius:24px;overflow:hidden;background:var(--suave);border:2px dashed #b8cbc6;display:grid;place-items:center;font-size:13px;text-align:center;color:var(--gris);font-weight:800;cursor:pointer;margin-top:8px;position:relative}
.subir-logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fotos-ed{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.fotos-ed .f{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--suave)}
.fotos-ed .f img{width:100%;height:100%;object-fit:cover}
.fotos-ed .f button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:14px}
.fotos-ed .add{aspect-ratio:1;border-radius:10px;border:2px dashed #b8cbc6;background:#fff;display:grid;place-items:center;font-size:28px;color:var(--gris)}
.menu-ed{border-top:1px solid var(--suave);padding:10px 0;display:flex;gap:8px;align-items:center}
.menu-ed div{flex:1;min-width:0}
.menu-ed button{border:0;background:#fee2e2;color:var(--rojo);border-radius:10px;width:36px;height:36px;font-weight:900;flex:none}
.agregar-menu{display:grid;grid-template-columns:1fr 110px;gap:8px;margin-top:10px}
.agregar-menu input:last-child{grid-column:1/-1}
.btn{border:0;border-radius:14px;padding:15px 16px;min-height:52px;font-weight:900;font-size:15.5px;background:var(--prim);color:#fff;width:100%;margin-top:14px;display:block;text-align:center;text-decoration:none}
.btn.sec{background:var(--suave);color:var(--texto)}
.btn.coral{background:var(--coral)}
.btn:disabled{opacity:.55}
.aviso{background:#fef9e7;border:1px solid #f6e3a1;border-radius:14px;padding:11px 13px;font-size:14px;margin:10px 0;line-height:1.45}
.aviso.ok{background:#e7f6ef;border-color:#b5e2cb}
.trampa{position:absolute;left:-5000px}

/* Mi negocio / Admin */
.item{background:#fff;border:1px solid var(--borde);border-radius:18px;padding:14px;margin-bottom:10px}
.item .top{display:flex;gap:12px;align-items:center}
.item h3{margin:0;font-size:16px}
.item .meta{font-size:13.5px;color:var(--gris);line-height:1.5;margin-top:6px}
.item .botones{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.item .botones button,.item .botones a{border:0;border-radius:11px;padding:10px 13px;font-weight:900;font-size:14px;text-decoration:none;background:var(--suave)}
.b-ok{background:var(--prim)!important;color:#fff}.b-no{background:#fee2e2!important;color:var(--rojo)}
.pest-admin{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.pest-admin button{border:1.5px solid var(--borde);background:#fff;border-radius:999px;padding:8px 14px;font-weight:900}
.pest-admin button.on{background:var(--texto);color:#fff;border-color:var(--texto)}

/* Hoja inferior (calificar / login) */
.velo{position:fixed;inset:0;background:rgba(10,30,28,.5);z-index:1200;display:none;align-items:flex-end;justify-content:center}
.velo.ver{display:flex}

<script type="module">
/* =====================================================================
   1) CONFIGURACIÓN (se edita en config.js)
   ===================================================================== */
const CONFIG = Object.assign({pueblo:"San Vicente de Chucurí", departamento:"Santander", centro:[6.8810,-73.4100], zoom:15, admins:[], firebase:{}}, window.GUIA_CONFIG || {});
CONFIG.firebase = CONFIG.firebase || {};

/* =====================================================================
   2) CATEGORÍAS, ASPECTOS Y DATOS BASE
   ===================================================================== */
const CATS = {
  emergencia:  {n:"Emergencias",  i:"🚨", c:"#dc2626"},
  salud:       {n:"Salud",        i:"🏥", c:"#db2777"},
  restaurante: {n:"Restaurantes", i:"🍽️", c:"#ea580c"},
  cafe:        {n:"Cafés",        i:"☕", c:"#92400e"},

};
const ASPECTOS = {
  sabor:{n:"Lo rico (sabor)",i:"😋"}, atencion:{n:"Atención y servicio",i:"🤝"}, tiempo:{n:"Rapidez (tiempo de espera)",i:"⏱️"},
  precio:{n:"Buen precio",i:"💲"}, ambiente:{n:"Decoración y ambiente",i:"🎨"}, ubicacion:{n:"Ubicación",i:"📍"},
  limpieza:{n:"Limpieza",i:"🧼"}, comodidad:{n:"Comodidad",i:"🛋️"}
};
const ASP_CAT = {
  restaurante:["sabor","atencion","tiempo","precio","ambiente","ubicacion"],
  cafe:["sabor","atencion","tiempo","precio","ambiente","ubicacion"],
  hotel:["atencion","limpieza","comodidad","precio","ambiente","ubicacion"],
  turismo:["atencion","limpieza","precio","ubicacion"],
  comercio:["atencion","tiempo","precio","ubicacion"],
  salud:["atencion","tiempo","limpieza","ubicacion"],
  transporte:["atencion","tiempo","precio","comodidad"],
  servicios:["atencion","tiempo","ubicacion"],
  emergencia:[]
};
const ORDEN_CHIPS = ["restaurante","hotel","turismo","cafe","comercio","transporte","salud","servicios","emergencia"];
const CATS_PUBLICAS = ["restaurante","hotel","cafe"];   // lo único que la gente puede crear
const NIVEL = ["","Muy malo","Malo","Regular","Bueno","Excelente"];
const SOS = [
  {t:"Línea única de emergencias", n:"123", i:"🚨", d:"Policía, ambulancia y bomberos. Gratis desde cualquier teléfono."},
  {t:"Bomberos", n:"119", i:"🚒", d:"Incendios, rescates y desastres."},
  {t:"Cruz Roja", n:"132", i:"⛑️", d:"Ambulancias y primeros auxilios."},
  {t:"Defensa Civil", n:"144", i:"🦺", d:"Emergencias por lluvias, derrumbes y desastres."},
  {t:"Policía (desde celular)", n:"112", i:"🚓", d:"Línea de la Policía Nacional."},
  {t:"Línea de la mujer", n:"155", i:"💜", d:"Orientación a mujeres víctimas de violencia."},
  {t:"ICBF – niños y familia", n:"141", i:"🧒", d:"Protección de niños, niñas y adolescentes."}
];
/* Lugares base (el admin los importa y luego les pone el punto en el mapa) */
const BASE = [
  {nombre:"Estación de Policía San Vicente de Chucurí", categoria:"emergencia", telefono:"3203064236", direccion:"Casco urbano (confirmar dirección)", descripcion:"Estación de la Policía Nacional. En emergencia marca 123.", horario:"24 horas"},
  {nombre:"Bomberos", categoria:"emergencia", telefono:"119", descripcion:"Incendios, rescates y emergencias. Línea nacional 119.", horario:"24 horas"},
  {nombre:"Hospital de San Vicente de Chucurí (ESE)", categoria:"salud", direccion:"Calle 8 # 11-2 (confirmar)", descripcion:"Hospital local con servicio de urgencias.", horario:"Urgencias 24 horas"},
  {nombre:"Alcaldía – Palacio Municipal", categoria:"servicios", direccion:"Calle 11 # 10-07", descripcion:"Alcaldía Municipal de San Vicente de Chucurí."},
  {nombre:"Comisaría de Familia", categoria:"servicios", telefono:"3202736005", direccion:"Calle 11 # 10-07, Palacio Municipal", descripcion:"Atención y protección a la familia, niños y mujeres."},
  {nombre:"Embalse Topocoro", categoria:"turismo", descripcion:"El gran embalse de la región, para paseos en lancha, pesca y paisaje."},
  {nombre:"Parque Natural Miraflores", categoria:"turismo", descripcion:"Naturaleza, senderos y avistamiento de aves."},

  {nombre:"Río Chucurí", categoria:"turismo", descripcion:"Río que da nombre a la región; charcos y paisaje."},
  {nombre:"Cueva de los Aviones", categoria:"turismo", descripcion:"Cueva para recorrido guiado."},
  {nombre:"Casa Memoria Histórica", categoria:"turismo", descripcion:"Museo sobre la historia del municipio."},
  {nombre:"Murales del pueblo", categoria:"turismo", descripcion:"Ruta de murales por las calles del casco urbano."},
  {nombre:"Tour del cacao", categoria:"turismo", descripcion:"San Vicente es la Capital Cacaotera de Colombia: conoce una finca y el proceso del chocolate."}
];
const CAMPOS = ["nombre","categoria","descripcion","telefono","whatsapp","direccion","horario","instagram","facebook","tiktok","web","lat","lng","menu","miniatura"];

/* =====================================================================
   3) DATOS: Firebase o modo de prueba (en este navegador)
   ===================================================================== */
const usarFirebase = !!CONFIG.firebase.apiKey;
let fb = null, usuario = null;

async function iniciarFirebase(){
  const v = "10.12.2";
  const app = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`);
  const fs  = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore.js`);
  const au  = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-auth.js`);
  const a = app.initializeApp(CONFIG.firebase);
  fb = {db: fs.getFirestore(a), auth: au.getAuth(a), fs, au};
  await new Promise(res => { let primera = true; au.onAuthStateChanged(fb.auth, u => { usuario = u; if (primera){ primera = false; res(); } else alCambiarSesion(); }); });
}

// --- almacenamiento local (modo de prueba) ---
const K = {lug:"guia2_lugares", fot:"guia2_fotos", res:"guia2_resenas"};
const lsL = k => { try { return JSON.parse(localStorage.getItem(k)) ?? null; } catch { return null; } };
const lsG = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { toast("El navegador no tiene más espacio para fotos de prueba"); return false; } };
const nuevoId = () => "l" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

const Datos = {
  async aprobados(){
    if (!usarFirebase) return (lsL(K.lug)||[]).filter(l => l.estado==="aprobado");
    const {collection, query, where, getDocs} = fb.fs;
    const s = await getDocs(query(collection(fb.db,"lugares"), where("estado","==","aprobado")));
    return s.docs.map(d => ({id:d.id, ...d.data()}));
  },
  async porEstado(estado){
    if (!usarFirebase) return (lsL(K.lug)||[]).filter(l => l.estado===estado);
    const {collection, query, where, getDocs} = fb.fs;
    const s = await getDocs(query(collection(fb.db,"lugares"), where("estado","==",estado)));
    return s.docs.map(d => ({id:d.id, ...d.data()}));
  },
  async mios(uid){
    if (!usarFirebase) return (lsL(K.lug)||[]).filter(l => l.ownerUid===uid);
    const {collection, query, where, getDocs} = fb.fs;
    const s = await getDocs(query(collection(fb.db,"lugares"), where("ownerUid","==",uid)));
    return s.docs.map(d => ({id:d.id, ...d.data()}));
  },
  async uno(id){
    if (!usarFirebase) return (lsL(K.lug)||[]).find(l => l.id===id) || null;
    const {doc, getDoc} = fb.fs;
    const s = await getDoc(doc(fb.db,"lugares",id));
    return s.exists() ? {id:s.id, ...s.data()} : null;
  },
  async crear(d){
    if (!usarFirebase){ const a = lsL(K.lug)||[], id = nuevoId(); a.push({...d, id, creado:Date.now()}); lsG(K.lug,a); return id; }
    const {collection, addDoc, serverTimestamp} = fb.fs;
    const r = await addDoc(collection(fb.db,"lugares"), {...d, creado: serverTimestamp()});
    return r.id;
  },
  async actualizar(id, c){
    if (!usarFirebase){ lsG(K.lug, (lsL(K.lug)||[]).map(l => l.id===id ? {...l, ...c} : l)); return; }
    const {doc, updateDoc} = fb.fs;
    await updateDoc(doc(fb.db,"lugares",id), c);
  },
  async borrar(id){
    if (!usarFirebase){ lsG(K.lug, (lsL(K.lug)||[]).filter(l => l.id!==id)); const f = lsL(K.fot)||{}; delete f[id]; lsG(K.fot,f); return; }
    const {doc, deleteDoc, collection, getDocs} = fb.fs;
    const fs = await getDocs(collection(fb.db,"lugares",id,"fotos"));
    for (const d of fs.docs) await deleteDoc(d.ref);
    await deleteDoc(doc(fb.db,"lugares",id));
  },
  /* ---- Fotos: lugares/{id}/fotos/{fid}  (tipo: portada | galeria | menu) ---- */
  async fotos(id){
    if (!usarFirebase) return ((lsL(K.fot)||{})[id] || []);
    const {collection, getDocs} = fb.fs;
    const s = await getDocs(collection(fb.db,"lugares",id,"fotos"));
    return s.docs.map(d => ({id:d.id, ...d.data()}));
  },
  async ponerFoto(id, fid, img, tipo){
    if (!usarFirebase){
      const f = lsL(K.fot)||{}, a = (f[id]||[]).filter(x => x.id!==fid);
      a.push({id: fid || nuevoId(), img, tipo, fecha: Date.now()}); f[id] = a; lsG(K.fot,f); return;
    }
    const {doc, setDoc, addDoc, collection, serverTimestamp} = fb.fs;
    const datos = {img, tipo, fecha: serverTimestamp()};
    if (fid) await setDoc(doc(fb.db,"lugares",id,"fotos",fid), datos);
    else await addDoc(collection(fb.db,"lugares",id,"fotos"), datos);
  },
  async fotoGente(id, img, uid, autor){
    if (!usarFirebase){ const f = lsL(K.fot)||{}; (f[id] = f[id]||[]).push({id:nuevoId(), img, tipo:"gente", uid, autor, fecha:Date.now()}); lsG(K.fot,f); return; }
    const {addDoc, collection, serverTimestamp} = fb.fs;
    await addDoc(collection(fb.db,"lugares",id,"fotos"), {img, tipo:"gente", uid, autor, fecha: serverTimestamp()});
  },
  async borrarFoto(id, fid){
    if (!usarFirebase){ const f = lsL(K.fot)||{}; f[id] = (f[id]||[]).filter(x => x.id!==fid); lsG(K.fot,f); return; }
    const {doc, deleteDoc} = fb.fs;
    await deleteDoc(doc(fb.db,"lugares",id,"fotos",fid));
  },
  /* ---- Reseñas: lugares/{id}/resenas/{uid} (una por persona) ---- */
  async resenas(id){
    if (!usarFirebase) return (lsL(K.res)||[]).filter(r => r.lugarId===id).sort((a,b)=>b.fecha-a.fecha);
    const {collection, query, orderBy, limit, getDocs} = fb.fs;
    const s = await getDocs(query(collection(fb.db,"lugares",id,"resenas"), orderBy("fecha","desc"), limit(50)));
    return s.docs.map(d => ({id:d.id, ...d.data()}));
  },
  async guardarResena(id, uid, autor, puntos, comentario){
    if (!usarFirebase){
      const todas = lsL(K.res)||[], vieja = todas.find(r => r.lugarId===id && r.uid===uid);
      const lug = lsL(K.lug)||[], l = lug.find(x => x.id===id);
      l.resumen = sumarResumen(l.resumen, vieja?.puntos, puntos); lsG(K.lug,lug);
      lsG(K.res, [...todas.filter(r => r!==vieja), {lugarId:id, uid, autor, puntos, comentario, fecha:Date.now()}]); return;
    }
    const {doc, runTransaction, serverTimestamp} = fb.fs;
    const rL = doc(fb.db,"lugares",id), rR = doc(fb.db,"lugares",id,"resenas",uid);
    await runTransaction(fb.db, async tx => {
      const sl = await tx.get(rL), sr = await tx.get(rR);
      tx.set(rR, {uid, autor, puntos, comentario, fecha: serverTimestamp()});
      tx.update(rL, {resumen: sumarResumen(sl.data().resumen, sr.exists() ? sr.data().puntos : null, puntos)});
    });
  },
  async borrarResena(id, uid){
    if (!usarFirebase){
      const todas = lsL(K.res)||[], v = todas.find(r => r.lugarId===id && r.uid===uid); if (!v) return;
      const lug = lsL(K.lug)||[], l = lug.find(x => x.id===id); l.resumen = sumarResumen(l.resumen, v.puntos, null); lsG(K.lug,lug);
      lsG(K.res, todas.filter(r => r!==v)); return;
    }
    const {doc, runTransaction} = fb.fs;
    const rL = doc(fb.db,"lugares",id), rR = doc(fb.db,"lugares",id,"resenas",uid);
    await runTransaction(fb.db, async tx => {
      const sl = await tx.get(rL), sr = await tx.get(rR); if (!sr.exists()) return;
      tx.update(rL, {resumen: sumarResumen(sl.data().resumen, sr.data().puntos, null)}); tx.delete(rR);
    });
  }
};
function sumarResumen(res, quitar, poner){
  const r = {n: res?.n || 0, s: {...(res?.s || {})}};
  if (quitar){ r.n -= 1; for (const k in quitar) r.s[k] = (r.s[k]||0) - quitar[k]; }
  if (poner){  r.n += 1; for (const k in poner)  r.s[k] = (r.s[k]||0) + poner[k]; }
  for (const k of Object.keys(ASPECTOS)) if (!r.s[k]) delete r.s[k];
  return r;
}

/* ---- Sesión ---- */
const DEMO_USER = {uid:"demo-usuario", displayName:"Tú (prueba)", email:""};
const yo = () => usarFirebase ? usuario : DEMO_USER;
const esAdmin = () => usarFirebase ? !!(usuario && CONFIG.admins.map(a=>a.toLowerCase()).includes((usuario.email||"").toLowerCase())) : modoAdminDemo();
const modoAdminDemo = () => { try { return sessionStorage.getItem("demoAdmin")==="1"; } catch { return false; } };
async function entrarGoogle(){
  try { await fb.au.signInWithPopup(fb.auth, new fb.au.GoogleAuthProvider()); return true; }
  catch(e){
    if (["auth/popup-blocked","auth/operation-not-supported-in-this-environment"].includes(e.code)){ await fb.au.signInWithRedirect(fb.auth, new fb.au.GoogleAuthProvider()); }
    else if (!["auth/popup-closed-by-user","auth/cancelled-popup-request"].includes(e.code)) toast("No se pudo entrar: "+e.code);
    return false;
  }
}
// Pide iniciar sesión con Google y devuelve true cuando hay usuario
function pedirSesion(motivo){
  if (yo()) return Promise.resolve(true);
  return new Promise(res => {
    abrirHoja(`<div class="hoja-cab"><h2>Entra con tu cuenta</h2><button class="cerrar" data-cerrar>✕</button></div>
      <div class="aviso">${motivo}</div><button class="btn" id="btnEntrar">Entrar con Google</button>`);
    $("#btnEntrar").onclick = async () => { const ok = await entrarGoogle(); if (ok){ cerrarHoja(); res(true); } };
    hojaAlCerrar = () => res(false);
  });
}
function alCambiarSesion(){
  if ($("#negocio").classList.contains("ver")) pintarNegocio();
  if ($("#admin").classList.contains("ver")) pintarAdmin();
}

/* =====================================================================
   4) UTILIDADES
   ===================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const soloDig = s => String(s||"").replace(/\D/g,"");
const tieneUbic = l => typeof l.lat === "number" && typeof l.lng === "number";
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const fmt1 = v => v.toFixed(1).replace(".",",");
const estrellasTxt = v => { const n = Math.round(v); return "★".repeat(n) + "☆".repeat(5-n); };
const imgOk = s => typeof s === "string" && /^data:image\/(jpeg|png|webp);base64,/.test(s);
function toast(t, ms=2600){ const e=$("#toast"); e.textContent=t; e.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>e.style.display="none", ms); }
function waNumero(n){ let d=soloDig(n); if (d.length===10) d="57"+d; return d; }
function urlLugar(l){ return location.origin + location.pathname + "#" + l.id; }
function linkRed(tipo, v){
  v = String(v||"").trim(); if (!v) return "";
  if (/^https?:\/\//i.test(v)) return v;
  const h = v.replace(/^@/,"").replace(/^(www\.)?(instagram|facebook|tiktok)\.com\/@?/i,"");
  return {instagram:`https://instagram.com/${h}`, facebook:`https://facebook.com/${h}`, tiktok:`https://www.tiktok.com/@${h}`, web:`https://${v}`}[tipo];
}
function promAspecto(l,k){ const r = l.resumen; return r && r.n>0 && r.s?.[k] ? r.s[k]/r.n : null; }
function promGeneral(l){ const v = (ASP_CAT[l.categoria]||[]).map(k=>promAspecto(l,k)).filter(x=>x!=null); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; }
function emojiLugar(l){
  if (l.icono) return l.icono;
  const n = norm(l.nombre);
  if (/polic/.test(n)) return "🚓"; if (/bomber/.test(n)) return "🚒"; if (/hospital|clinica|urgencia/.test(n)) return "🏥";
  if (/cruz roja/.test(n)) return "⛑️"; if (/defensa civil/.test(n)) return "🦺";
  return CATS[l.categoria]?.i || "📍";
}
function icoHtml(l){ return imgOk(l.miniatura) ? `<img src="${l.miniatura}" alt="">` : emojiLugar(l); }
function calHtml(l){ const g = promGeneral(l); return g==null ? "" : `<span class="cal"><span class="estrellas">★</span>${fmt1(g)} <small>(${l.resumen.n})</small></span>`; }

/* Reduce una foto del celular para que pese poco */
function comprimir(file, maxLado, calidad=0.72, cuadrada=false){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      let sx=0, sy=0, sw=img.width, sh=img.height;
      if (cuadrada){ const m = Math.min(sw,sh); sx=(sw-m)/2; sy=(sh-m)/2; sw=sh=m; }
      const esc_ = Math.min(1, maxLado/Math.max(sw,sh)), w = Math.round(sw*esc_), h = Math.round(sh*esc_);
      const cv = document.createElement("canvas"); cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
      URL.revokeObjectURL(url);
      let q = calidad, d = cv.toDataURL("image/jpeg", q);
      while (d.length > (cuadrada ? 45000 : 650000) && q > 0.35){ q -= 0.08; d = cv.toDataURL("image/jpeg", q); }
      res(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("imagen")); };
    img.src = url;
  });
}

let lugares = [], filtroCat = null, texto = "", ordenar = "auto", miUbic = null, marcaYo = null;
let mapa, grupo, capaOficial = null, marcadores = {};

function distM(l){ if (!miUbic || !tieneUbic(l)) return null;
  const R=6371000, r=x=>x*Math.PI/180, a=r(l.lat-miUbic.lat), b=r(l.lng-miUbic.lng);
  const h=Math.sin(a/2)**2+Math.cos(r(miUbic.lat))*Math.cos(r(l.lat))*Math.sin(b/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const fmtDist = m => m==null ? "" : m<1000 ? Math.round(m/10)*10+" m" : (m/1000).toFixed(m<10000?1:0).replace(".",",")+" km";

$("#btnSOS").onclick = abrirEmergencias;
function pintarChips(){
  $("#chips").innerHTML = `<button class="chip ${!filtroCat?'on':''}" data-cat="">Todo</button>` +

}
$("#chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; filtroCat = b.dataset.cat || null; pintarChips(); pintar(true); });
$("#q").addEventListener("input", e => { texto = norm(e.target.value); pintar(false); });

function filtrados(){
  return lugares.filter(l => (!filtroCat || l.categoria===filtroCat) &&
    (!texto || norm([l.nombre,l.descripcion,l.direccion,CATS[l.categoria]?.n,(l.menu||[]).map(m=>m.n).join(" ")].join(" ")).includes(texto)))
  .sort((a,b) => {
    if (ordenar==="estrellas"){ const pa=promGeneral(a)??-1, pb=promGeneral(b)??-1; if (pa!==pb) return pb-pa; return (b.resumen?.n||0)-(a.resumen?.n||0); }
    if (miUbic){ const da=distM(a), db=distM(b); if (da!=null||db!=null) return (da??1e12)-(db??1e12); }
    return (a.categoria==="emergencia"?0:1)-(b.categoria==="emergencia"?0:1) || a.nombre.localeCompare(b.nombre,"es");
  });
}
function iniciarMapa(){
  if (!window.L){ $("#mapa").innerHTML = '<div class="vacio">No se pudo cargar el mapa. Revisa tu conexión.</div>'; return; }
  mapa = L.map("mapa", {zoomControl:false}).setView(CONFIG.centro, CONFIG.zoom);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(mapa);
  grupo = L.markerClusterGroup({showCoverageOnHover:false, maxClusterRadius:45});
  mapa.addLayer(grupo);

function iconoPin(l){   // todos los lugares: círculo del color de su categoría
  const col = CATS[l.categoria]?.c || "#555";
  return L.divIcon({className:"", html:`<div class="pin" style="background:${col}"></div>`, iconSize:[24,24], iconAnchor:[12,12]});
}

function pintar(ajustar){
  const fl = filtrados();
  $("#lista").innerHTML = `<div class="lista-cab">${fl.length} lugar${fl.length===1?"":"es"}${filtroCat?" en "+CATS[filtroCat].n:""}</div>
    <div class="orden"><button data-o="auto" class="${ordenar==="auto"?"on":""}">${miUbic?"📍 Más cercanos":"🔤 Todos"}</button><button data-o="estrellas" class="${ordenar==="estrellas"?"on":""}">⭐ Mejor calificados</button></div>` +
    (fl.length ? fl.map(l => `<div class="tarjeta" data-id="${esc(l.id)}">
        <div class="ico" style="background:${CATS[l.categoria]?.c}1f">${icoHtml(l)}</div>
        <div class="cuerpo"><h3>${esc(l.nombre)}</h3><p>${esc(l.direccion || l.descripcion || CATS[l.categoria]?.n || "")}</p>
          ${calHtml(l)} ${l.oficial?'<span class="tag oficial">✓ Del municipio</span>':''} ${!tieneUbic(l)?'<span class="tag sinpin">Ubicación pendiente</span>':''}</div>
        ${distM(l)!=null?`<span class="dist">${fmtDist(distM(l))}</span>`:""}
      </div>`).join("")
    : `<div class="vacio">No encontramos lugares con ese filtro.</div>`) +
    `<div class="pie">¿Tienes un negocio? Créale su perfil gratis en <b>🏪 Mi negocio</b>.</div>`;
  if (!grupo) return;
  grupo.clearLayers(); marcadores = {};
  if (!capaOficial){ capaOficial = L.layerGroup(); mapa.addLayer(capaOficial); }
  capaOficial.clearLayers();
  fl.filter(tieneUbic).forEach(l => {
    const m = L.marker([l.lat,l.lng], {icon: iconoPin(l), title: l.nombre, zIndexOffset: l.categoria==="emergencia" ? 1000 : 0});
    m.on("click", ev => { L.DomEvent.stopPropagation(ev); mostrarVistaPin(l); });

  if (ajustar && filtroCat && grupo.getLayers().length) mapa.fitBounds(grupo.getBounds().pad(0.2), {maxZoom:16});

function mostrarVistaPin(l){

function cercaDeMi(enLista){
  if (!navigator.geolocation) return toast("Tu celular no permite ubicación");
  toast("Buscando dónde estás…");
  navigator.geolocation.getCurrentPosition(p => {
    miUbic = {lat:p.coords.latitude, lng:p.coords.longitude};

function resumenHtml(l){

/* Calificar */
async function abrirCalificar(l){
  if (!(await pedirSesion("Para que las calificaciones sean reales, cada persona entra con su cuenta de Google y deja <b>una reseña por lugar</b>. Solo se muestra el nombre que escribas."))) return;
  const u = yo();
  if (l.ownerUid && l.ownerUid === u.uid) return toast("No puedes calificar tu propio negocio 😉");
  const asp = ASP_CAT[l.categoria]||[];
  let previa = null; try { previa = (await Datos.resenas(l.id)).find(r => (r.uid||r.id)===u.uid) || null; } catch {}
  const puntos = {...(previa?.puntos||{})};
  abrirHoja(`<div class="hoja-cab"><h2>${previa?"Editar tu reseña":"Calificar"} · ${esc(l.nombre)}</h2><button class="cerrar" data-cerrar>✕</button></div>
    <div class="ayuda">Toca las estrellas: 1 = muy malo, 5 = excelente.</div>
    ${asp.map(k => `<div class="calificar-fila" data-k="${k}"><div class="nom"><span>${ASPECTOS[k].i} ${ASPECTOS[k].n}</span><small class="txt">${puntos[k]?NIVEL[puntos[k]]:"Sin calificar"}</small></div>
      <div class="pick">${[1,2,3,4,5].map(v=>`<button type="button" data-v="${v}" class="${(puntos[k]||0)>=v?"on":""}" aria-label="${v} estrellas">★</button>`).join("")}</div></div>`).join("")}
    <form class="form" id="fRes" novalidate>
      <label>Cuéntanos tu experiencia</label>
      <textarea name="comentario" maxlength="500" placeholder="¿Qué pediste? ¿Cómo te atendieron? ¿Lo recomiendas?">${esc(previa?.comentario)}</textarea>
      <label>Tu nombre (se muestra en la reseña)</label>
      <input name="autor" maxlength="40" value="${esc(previa?.autor || (usarFirebase ? (u.displayName||"").split(" ")[0] : ""))}" placeholder="Ej: Carolina">
      <button class="btn" type="submit">${previa?"Actualizar reseña":"Publicar reseña"}</button>
    </form>`);
  $("#hoja").querySelectorAll(".calificar-fila").forEach(fila => fila.addEventListener("click", e => {
    const b = e.target.closest("button[data-v]"); if (!b) return;
    const k = fila.dataset.k, v = +b.dataset.v; puntos[k] = v;
    fila.querySelectorAll("button").forEach(x => x.classList.toggle("on", +x.dataset.v <= v));
    fila.querySelector(".txt").textContent = NIVEL[v];
  }));
  $("#fRes").onsubmit = async e => {
    e.preventDefault();
    const faltan = asp.filter(k => !puntos[k]);
    if (faltan.length) return toast("Califica también: " + faltan.map(k=>ASPECTOS[k].n).join(", "));
    const f = new FormData(e.target), limpio = {}; asp.forEach(k => limpio[k] = puntos[k]);
    const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
    try {
      await Datos.guardarResena(l.id, u.uid, (String(f.get("autor")||"").trim()||"Visitante").slice(0,40), limpio, String(f.get("comentario")||"").trim().slice(0,500));
      cerrarHoja(); toast("¡Gracias por tu reseña! ⭐"); await recargar(); abrirPerfil(l.id, "resenas");
    } catch(err){ console.error(err); toast("No se pudo guardar: "+(err.code||err.message)); btn.disabled = false; }
  };
}

function pintarFotosEditor(){
  $("#edPortada").innerHTML = ED.portada ? `<img src="${ED.portada}" alt="">` : "＋ Toca para subir la portada";

    const fs = ED.fotos.filter(f => f.tipo===tipo);
    return fs.map(f => `<div class="f"><img src="${f.img}" alt=""><button type="button" data-q="${esc(f.id||f.tmp)}">✕</button></div>`).join("") +
      (fs.length < max ? `<button type="button" class="add" data-add="${tipo}">＋</button>` : "");
  };
  $("#edGaleria").innerHTML = caja("galeria", 12);
  $("#edFotosMenu").innerHTML = caja("menu", 6);
  ["#edGaleria","#edFotosMenu"].forEach(s => $(s).onclick = async e => {
    const q = e.target.closest("[data-q]"), a = e.target.closest("[data-add]");
    if (q){ const f = ED.fotos.find(x => (x.id||x.tmp)===q.dataset.q); if (f?.guardada) ED.borrar.push(f.id); ED.fotos = ED.fotos.filter(x => x!==f); pintarFotosEditor(); }
    if (a){ const file = await elegirFoto(); if (!file) return; toast("Preparando foto…");
      try { ED.fotos.push({tmp: nuevoId(), tipo: a.dataset.add, img: await comprimir(file, 1100)}); pintarFotosEditor(); } catch { toast("No se pudo leer esa foto"); } }

}
function pintarMenuEditor(){

  $("#edMenu").onclick = e => { const b = e.target.closest("button[data-i]"); if (b){ ED.menu.splice(+b.dataset.i,1); pintarMenuEditor(); } };
}
async function guardarEditor(e){
  e.preventDefault();
  const f = new FormData(e.target); if (f.get("sitio_web2")) return;
  const d = {};
  ["nombre","categoria","descripcion","telefono","whatsapp","direccion","horario","instagram","facebook","tiktok","web"].forEach(k => d[k] = String(f.get(k)||"").trim());
  if (esAdmin()) d.icono = String(f.get("icono")||"");
  if (d.nombre.length < 2) return toast("Escribe el nombre del lugar");
  if (!esAdmin() && soloDig(d.telefono).length < 3) return toast("Escribe un teléfono válido");
  if (!ED.ubic && !ED.lugar) return toast("Marca la ubicación en el mapa");
  if (ED.ubic){ d.lat = ED.ubic.lat; d.lng = ED.ubic.lng; }
  d.menu = ED.menu;
  if (ED.miniatura) d.miniatura = ED.miniatura;
  const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Guardando…";
  try {
    let id;
    if (ED.lugar){ id = ED.lugar.id; await Datos.actualizar(id, d); }
    else if (esAdmin()) id = await Datos.crear({...d, estado:"aprobado", oficial:true});
    else { id = await Datos.crear({...d, estado:"pendiente", oficial:false, ownerUid: yo().uid}); avisarAdmin(d, id); }
    if (ED.portadaCambio && ED.portada) await Datos.ponerFoto(id, "portada", ED.portada, "portada");
    for (const fid of ED.borrar) await Datos.borrarFoto(id, fid);
    for (const fo of ED.fotos.filter(x => !x.guardada)) await Datos.ponerFoto(id, null, fo.img, fo.tipo);
    cerrarPantalla("editor"); await recargar();
    if (!ED.lugar && esAdmin()) toast("Lugar oficial publicado ✓");
    else if (!ED.lugar){
      abrirHoja(`<div class="hoja-cab"><h2>¡Perfil enviado! 🎉</h2><button class="cerrar" data-cerrar>✕</button></div>
        <div class="aviso ok">Tu lugar <b>${esc(d.nombre)}</b> quedó en revisión. Aparecerá en la guía apenas el administrador confirme que es real. Mientras tanto puedes seguir completándolo desde <b>Mi negocio</b>.</div>
        <button class="btn" data-cerrar>Listo</button>`);
    } else toast("Cambios guardados ✓");
    if ($("#negocio").classList.contains("ver")) pintarNegocio();
    if ($("#admin").classList.contains("ver")) pintarAdmin();
    if ($("#perfil").classList.contains("ver")) abrirPerfil(id);
  } catch(err){ console.error(err); toast("No se pudo guardar: "+(err.code||err.message)); btn.disabled = false; btn.textContent = ED.lugar ? "Guardar cambios" : "Enviar para aprobación"; }
}

/* Aviso por correo al administrador cuando llega un lugar nuevo (FormSubmit.co) */
function avisarAdmin(d, id){
  if (!CONFIG.avisoCorreo) return;
  const base = location.origin + location.pathname;
  fetch("https://formsubmit.co/ajax/" + CONFIG.avisoCorreo, {
    method: "POST", headers: {"Content-Type":"application/json", "Accept":"application/json"},
    body: JSON.stringify({
      _subject: `🏪 Nuevo lugar para aprobar: ${d.nombre}`,
      _template: "table", _captcha: "false",
      "Lugar": d.nombre, "Categoría": CATS[d.categoria]?.n || d.categoria,
      "Teléfono": d.telefono, "WhatsApp": d.whatsapp || "—", "Dirección": d.direccion || "—",
      "Descripción": d.descripcion || "—", "Inscrito por": (yo()?.displayName || "") + " " + (yo()?.email || ""),
      "Aprobar aquí": base + "#admin", "Ver perfil": base + "#" + id
    })
  }).catch(() => {});
}

/* =====================================================================
   9) PANEL DE ADMINISTRACIÓN  (link terminado en #admin)
   ===================================================================== */
let pestAdmin = "pendiente";
async function pintarAdmin(){
  const A = $("#admin");
  const cab = `<div class="barra-sup"><button class="atras" data-volver="admin">←</button><h2>⚙️ Administración</h2></div>`;
  if (!esAdmin()){
    A.innerHTML = cab + `<div class="contenido">${usuario?`<div class="aviso">La cuenta ${esc(usuario.email)} no es administradora.</div>`:""}
      <p>Entra con la cuenta de Google del administrador para aprobar lugares.</p><button class="btn" id="adEntrar">Entrar con Google</button>
      ${usuario?`<button class="btn sec" id="adSalir">Cerrar sesión</button>`:""}</div>`;
    $("#adEntrar").onclick = entrarGoogle; const s = $("#adSalir"); if (s) s.onclick = () => fb.au.signOut(fb.auth);
    return;
  }
  A.innerHTML = cab + `<div class="contenido">
    <div class="pest-admin">${[["pendiente","⏳ Por aprobar"],["aprobado","✅ Publicados"],["rechazado","🚫 Rechazados"]].map(([k,t])=>`<button data-p="${k}" class="${pestAdmin===k?"on":""}">${t}</button>`).join("")}</div>
    <div id="adLista"><div class="vacio">Cargando…</div></div>
    <div class="bloque"><h3>Herramientas</h3><p class="ayuda">Crea bomberos, policía, hospital y sitios turísticos con su punto en el mapa. O importa la lista base y luego edita cada uno para marcarlo en el mapa.</p>
      <button class="btn" id="adNuevo">＋ Crear lugar oficial</button>
      <button class="btn sec" id="adImportar">Importar lugares base</button></div></div>`;
  A.querySelectorAll(".pest-admin button").forEach(b => b.onclick = () => { pestAdmin = b.dataset.p; pintarAdmin(); });
  $("#adImportar").onclick = importarBase;
  $("#adNuevo").onclick = () => abrirEditor(null);
  let items = [];
  try { items = await Datos.porEstado(pestAdmin); } catch(e){ $("#adLista").innerHTML = `<div class="aviso">Error leyendo datos (${esc(e.code||e.message)}). Revisa las reglas y el correo de administrador.</div>`; return; }
  items.sort((a,b) => (b.creado?.seconds||b.creado||0) - (a.creado?.seconds||a.creado||0));
  $("#adLista").innerHTML = items.length ? items.map(l => `<div class="item" data-id="${esc(l.id)}">
      <div class="top"><div class="ico" style="background:${CATS[l.categoria]?.c}1f">${icoHtml(l)}</div><div><h3>${esc(l.nombre)}</h3><span class="tag">${esc(CATS[l.categoria]?.n)}</span> ${calHtml(l)}</div></div>
      <div class="meta">📞 ${esc(l.telefono||"—")}${l.whatsapp?" · 💬 "+esc(l.whatsapp):""}${l.direccion?"<br>📍 "+esc(l.direccion):""}${!tieneUbic(l)?"<br><b>Sin punto en el mapa</b>":""}</div>
      <div class="botones">
        ${l.telefono?`<a href="tel:${soloDig(l.telefono)}">📞 Llamar</a>`:""}
        <button data-a="ver">👁️ Ver perfil</button>
        ${pestAdmin!=="aprobado"?`<button class="b-ok" data-a="aprobar">✓ Aprobar</button>`:""}
        <button data-a="editar">✏️ Editar</button>
        ${pestAdmin==="pendiente"?`<button class="b-no" data-a="rechazar">Rechazar</button>`:""}
        ${pestAdmin==="aprobado"?`<button class="b-no" data-a="rechazar">Ocultar</button>`:""}
      </div></div>`).join("")
    : `<div class="vacio">${pestAdmin==="pendiente"?"No hay solicitudes nuevas 🎉":"Nada por aquí."}</div>`;
  $("#adLista").onclick = async e => {
    const b = e.target.closest("button[data-a]"); if (!b) return;
    const l = items.find(x => x.id === b.closest(".item").dataset.id), a = b.dataset.a;
    try {
      if (a==="ver") return abrirPerfil(l.id);
      if (a==="editar") return abrirEditor(l);
      await Datos.actualizar(l.id, {estado: a==="aprobar" ? "aprobado" : "rechazado"});
      toast(a==="aprobar" ? "Publicado ✓" : "Quitado de la guía"); await recargar(); pintarAdmin();
    } catch(err){ console.error(err); toast("Error: "+(err.code||err.message)); }
  };
}
async function importarBase(){
  const b = $("#adImportar"); b.disabled = true; b.textContent = "Importando…";
  try {
    const ya = new Set([...(await Datos.porEstado("aprobado")), ...(await Datos.porEstado("pendiente"))].map(l => norm(l.nombre)));
    let n = 0;
    for (const l of BASE){ if (ya.has(norm(l.nombre))) continue; await Datos.crear({telefono:"", ...l, estado:"aprobado", oficial:true}); n++; }
    toast(n ? `${n} lugares importados ✓` : "Ya estaban importados"); await recargar(); pestAdmin = "aprobado"; pintarAdmin();
  } catch(e){ console.error(e); toast("Error importando: "+(e.code||e.message)); b.disabled = false; }
}

/* =====================================================================
   10) ARRANQUE
   ===================================================================== */
async function recargar(){
  try { lugares = await Datos.aprobados(); } catch(e){ console.error(e); toast("No se pudieron cargar los lugares"); lugares = []; }
  pintar(false);
}
function ruta(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (h==="emergencias"){ abrirEmergencias(); return; }
  if (h==="admin"){ if (!usarFirebase) try { sessionStorage.setItem("demoAdmin","1"); } catch {} abrirPantalla("admin"); pintarAdmin(); return; }
  if (h) abrirPerfil(h);
}
window.addEventListener("hashchange", ruta);

(async function(){
  document.title = "Guía de " + CONFIG.pueblo;
  $("#nombrePueblo").textContent = CONFIG.pueblo;
  if (CONFIG.logo){ // logo del pueblo arriba, grande
    const img = new Image(); img.className = "logo-pueblo"; img.alt = CONFIG.pueblo;
    img.onload = () => { const t = document.querySelector(".titulo"); t.classList.add("con-logo"); t.querySelector(".logo").replaceWith(img); };
    img.src = CONFIG.logo;
  }
  pintarChips(); iniciarMapa(); pintar(false);
  if (usarFirebase){ try { await iniciarFirebase(); } catch(e){ console.error(e); toast("Error conectando con la base de datos"); } }
  else {
    $("#demo").hidden = false;
    if (!lsL(K.lug)) lsG(K.lug, [...(window.GUIA_EJEMPLOS||[]), ...BASE.map(l => ({...l, estado:"aprobado", oficial:true}))].map((l,i) => ({telefono:"", id:"base"+i, creado:Date.now(), ...l})));
    if (!lsL(K.res)) lsG(K.res, window.GUIA_EJEMPLOS_RESENAS || []);
  }
  await recargar(); ruta();
})();
</script>
